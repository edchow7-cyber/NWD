name: Assemble Next Watch Helper v2.2.2

on:
  push:
    paths:
      - 'helper_parts/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact helper source
        shell: bash
        run: |
          set -euo pipefail
          cat helper_parts/part-* > /tmp/helper.b64
          base64 -d /tmp/helper.b64 > Helper_v2.2.2_transient_drive_retry.js
          echo 'c5ed921b69c395a9755683d4090c4b379d6a7f63d3c071374186c170e0e2f069  Helper_v2.2.2_transient_drive_retry.js' | sha256sum -c -
      - name: Commit exact source and remove temporary assembly files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf helper_parts
          rm -f .github/workflows/assemble-helper-v222.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Helper v2.2.2: automatic transient Google Drive retry'
          git push
