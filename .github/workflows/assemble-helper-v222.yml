name: Assemble Next Watch Helper v2.2.3

on:
  push:
    paths:
      - 'helper_parts/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact helper source
        shell: bash
        run: |
          set -euo pipefail
          cat helper_parts/part-* > /tmp/helper.gz.b64
          base64 -d /tmp/helper.gz.b64 | gunzip > Helper_v2.2.3_developer_tools.js
          echo '7298b77b82a06eb4f842e9ec88ca7a6f1ffed35f7190612c1a8fedfa791cff99  Helper_v2.2.3_developer_tools.js' | sha256sum -c -
      - name: Commit exact source and remove temporary assembly files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf helper_parts
          rm -f .github/workflows/assemble-helper-v222.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Helper v2.2.3: developer tooling and validated maintenance retry'
          git push
